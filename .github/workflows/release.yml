name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    # macOS 15 runner → Xcode 16 / macOS 15 SDK, required to compile WhisperKit.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Import signing certificate
        # The "Cape Signing" certificate (a self-signed code-signing identity) lives
        # in repo secrets as a base64 .p12. It goes into a throwaway keychain that
        # exists only for this job — so every release carries the same signature.
        env:
          P12: ${{ secrets.CAPE_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.CAPE_SIGNING_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::error::CAPE_SIGNING_P12 secret is missing — releases must be signed"; exit 1
          fi
          KC="$RUNNER_TEMP/cape-signing.keychain-db"
          KC_PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cape.p12"
          security import "$RUNNER_TEMP/cape.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cape.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

      - name: Build & package
        env:
          VERSION: ${{ github.ref_name }}
          REQUIRE_SIGNING: "1"   # never publish an unsigned (ad-hoc) release
        run: ./build-app.sh

      - name: Zip the app
        run: ditto -c -k --keepParent Cape.app Cape.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Tags with a pre-release identifier (e.g. -beta, -rc) are marked as pre-releases.
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac

          # Use the matching CHANGELOG section as the release notes; fall back to
          # auto-generated notes if there's no entry for this version.
          awk -v ver="[${TAG#v}]" '
            /^## / { if (found) exit; if (index($0, ver)) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$TAG" Cape.zip --title "$TAG" --notes-file notes.md $PRERELEASE
          else
            gh release create "$TAG" Cape.zip --title "$TAG" --generate-notes $PRERELEASE
          fi
