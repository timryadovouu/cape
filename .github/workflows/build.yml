name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & package
    # macOS 15 runner → Xcode 16 / macOS 15 SDK, required to compile WhisperKit.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Package mac-notch.app
        run: ./build-app.sh

      - name: Upload app bundle
        uses: actions/upload-artifact@v5
        with:
          name: mac-notch-app
          path: mac-notch.app
          if-no-files-found: error
